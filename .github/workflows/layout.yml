name: Layout no navegador

# Comportamentos que dependem de layout real — fim da rolagem, overflow, posição de listas e
# menus, foco sob cabeçalho fixo, movimento reduzido — medidos em Chromium, Firefox e WebKit sobre
# as stories do Storybook (tests/layout). O jsdom dos testes unitários não tem layout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: Testes de layout (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      # Memória compartilhada do host: o /dev/shm padrão do Docker (64 MB) não basta para três
      # navegadores em paralelo — o Firefox caía com "Target crashed" (recomendação do Playwright).
      options: --ipc=host
    # O Firefox não abre se o $HOME não pertencer ao usuário do contêiner (limitação conhecida do
    # Firefox em contêineres no GitHub Actions).
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen && pnpm build:tokens && pnpm build:storybook
      - run: pnpm test:layout
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: relatorio-layout
          path: tests/layout/playwright-report
          retention-days: 14
