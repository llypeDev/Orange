name: Deploy docs

# Publica a documentação (com o Storybook em /storybook) no GitHub Pages.
# Ative em Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lê a configuração do Pages: com domínio próprio o site fica na raiz
      # (base_path vazio); sem ele, em /<repositório>.
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm build
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
          # URL absoluta (com domínio): canonical, Open Graph, hreflang, sitemap.xml e robots.txt.
          DOCS_SITE_URL: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
