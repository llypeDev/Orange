name: Release

# Versiona e publica @orangesys/tokens e @orangesys/ui com Changesets (ver CONTRIBUTING.md → Publicação).
#
# 1. Push em main com changesets pendentes → abre ou atualiza o PR "Versionar pacotes"
#    (versões novas + CHANGELOG.md de cada pacote).
# 2. Merge desse PR → não há mais changesets e a versão nova não está no npm → publica
#    com provenance, cria as tags e as GitHub Releases.
#
# Autenticação no npm por trusted publishing (OIDC): o npm confia neste workflow
# (llypeDev/Orange + release.yml) e emite uma credencial de uso único a cada
# publicação. Não há token guardado em secret. Precisa de npm >= 11.5.1 e Node >= 22.14,
# e do trusted publisher cadastrado em cada pacote no npmjs.com (CONTRIBUTING.md → Publicação).
#
# changesets/action: `v2` é um branch nesse repositório (não uma tag), por isso a
# versão fica fixada na tag de release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Nunca interromper uma publicação no meio.
  cancel-in-progress: false

jobs:
  select-mode:
    name: Escolher etapa
    # Forks não versionam nem publicam.
    if: github.repository == 'llypeDev/Orange'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # version: há changesets · publish: há versão local que não está no npm · none: nada a fazer
      - id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Versionar pacotes (PR)
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit das versões no branch do PR
      pull-requests: write # abrir/atualizar o PR "Versionar pacotes"
    steps:
      - uses: actions/checkout@v5
        with:
          # Histórico completo: o changelog liga cada entrada ao commit e ao PR de origem.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Abrir ou atualizar o PR "Versionar pacotes"
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm version-packages
          commit-message: Versiona pacotes
          pr-title: Versionar pacotes
        env:
          # @changesets/changelog-github consulta PRs e autores na API do GitHub.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publicar no npm
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags e GitHub Releases
      id-token: write # trusted publishing (OIDC) e provenance
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # O `pnpm publish` chama o `npm publish` do PATH: é ele que faz a troca OIDC.
      - name: npm com trusted publishing (>= 11.5.1)
        run: |
          supports_oidc() {
            node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
          }
          supports_oidc || npm install --global npm@11
          echo "npm $(npm --version)"
      - run: pnpm install --frozen-lockfile
      - name: Publicar @orangesys/tokens e @orangesys/ui
        uses: changesets/action/publish@v2.1.2
        with:
          # gen + build dos pacotes + changeset publish (usa pnpm publish: aplica publishConfig e troca workspace:*)
          script: pnpm release
        env:
          # Com trusted publishing o provenance já é automático; fica explícito.
          NPM_CONFIG_PROVENANCE: true
      - name: Dica se a publicação falhar
        if: failure()
        run: |
          {
            echo '### A publicação no npm falhou'
            echo
            echo 'Erros `ENEEDAUTH`, `E401`, `E403` ou `E404` no `npm publish` costumam ser o trusted publisher:'
            echo 'confira em npmjs.com → pacote → Settings → Trusted Publisher se cada pacote tem'
            echo '`llypeDev` / `Orange` / `release.yml`, com `npm publish` permitido, e se a configuração não expirou'
            echo '(a primeira publicação precisa acontecer em até 2 dias). Detalhes: CONTRIBUTING.md → Publicação.'
          } >> "$GITHUB_STEP_SUMMARY"
